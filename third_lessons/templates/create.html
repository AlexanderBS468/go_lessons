{{ define "create" }}

{{ template "header"}}
<main class="px-3">
    <h1>Form add article</h1>
    <form action="/save_article" method="post">
        <input type="text" name="title" placeholder="Write title"><br><br>
        <textarea name="anons" placeholder="Anons" class="form-control" placeholder="Write Anons"></textarea><br><br>
        <textarea name="full_text" placeholder="Full text" class="form-control" placeholder="Write Full text"></textarea><br><br>
        <button class="btn btn-warning">Add article</button>
    </form>
</main>
