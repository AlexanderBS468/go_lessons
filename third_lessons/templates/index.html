{{ define "index" }}

{{ template "header"}}
<main class="px-3">
    <h1>Welcome to the Main Page.</h1>

    <p class="lead">Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>

    {{ range . }}
        <div class="alert alert-danger">
            <h2>{{ .Title }}</h2>
            <p>{{ .Anons }}</p>
            <a href="/post/{{ .Id }}" class="btn btn-danger">Read more</a>
        </div>
        
    {{ else }}
        <p>No articles found.</p>
    {{ end }}
</main>

{{ template "footer"}}

{{ end }}
